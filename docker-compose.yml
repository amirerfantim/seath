# A throw-away demo: Seath, PostgreSQL and a NATS server on one network.
# The passwords below are examples. Do not use this file for a real deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seath
      POSTGRES_PASSWORD: seath
      POSTGRES_DB: seath
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seath -d seath"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - seath-pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2-alpine

  # Only used to publish test messages: docker compose run --rm -T nats-box nats pub ...
  nats-box:
    image: natsio/nats-box
    profiles: ["tools"]

  seath:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DSN: postgres://seath:seath@postgres:5432/seath?sslmode=disable
    ports:
      - "${SEATH_PORT:-8080}:8080"

volumes:
  seath-pgdata:
